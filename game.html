<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Obby Game - Neon Star Edition</title>
    <style>
        :root {
            --neon-blue: #00e5ff;
            --neon-pink: #ff007f;
            --neon-purple: #b000ff;
            --gold: #ffd700;
            --bg-dark: #0b0c10;
            --panel-bg: rgba(11, 12, 16, 0.85);
        }

        body { 
            margin: 0; 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; 
            touch-action: none; 
        }
        
        #game-container { 
            position: relative; 
            width: 360px; 
            height: 640px; 
            border: 2px solid var(--neon-blue); 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3), inset 0 0 10px rgba(0,229,255,0.2); 
            background-color: var(--bg-dark); 
            transition: background-image 0.8s ease-in-out; 
            background-size: cover; 
            background-position: center; 
        }
        
        canvas { display: block; }
        
        /* UI Elements */
        .overlay {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 20; 
            backdrop-filter: blur(8px);
            background: var(--panel-bg);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Start Screen */
        #startScreen { background: linear-gradient(135deg, rgba(11,12,16,0.95), rgba(31,40,51,0.95)); }
        .logo-container { width: 100px; height: 100px; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        h1.title { margin: 0; font-size: 42px; color: var(--neon-blue); text-shadow: 0 0 15px var(--neon-blue), 0 0 30px var(--neon-purple); text-align: center; line-height: 1.1; font-weight: 900; letter-spacing: 2px; }
        .subtitle { color: #c5c6c7; margin-top: 15px; font-size: 14px; text-align: center; line-height: 1.6; padding: 0 20px; }
        
        /* Buttons */
        .btn-action { 
            margin-top: 20px; padding: 15px 35px; font-size: 18px; font-weight: bold; border: none; border-radius: 30px; 
            background: transparent; color: var(--neon-blue); cursor: pointer; 
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.4), inset 0 0 10px rgba(0,229,255,0.2); 
            transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-action:active { transform: scale(0.95); background: var(--neon-blue); color: #000; }
        .btn-action.gold { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 10px rgba(255,215,0,0.4); }
        .btn-action.gold:active { background: var(--gold); color: #000; }
        .btn-action.pink { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 10px rgba(255,0,127,0.4); }
        .btn-action.pink:active { background: var(--neon-pink); color: #000; }

        /* Level Select Screen */
        #levelSelectScreen h2 { color: var(--neon-purple); text-shadow: 0 0 10px var(--neon-purple); font-size: 28px; margin-bottom: 30px; margin-top: 0;}
        .level-grid { display: flex; flex-direction: column; gap: 15px; width: 80%; }
        .level-card { 
            background: rgba(255,255,255,0.05); border: 2px solid #333; border-radius: 12px; padding: 15px; 
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s;
        }
        .level-card.unlocked { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0,229,255,0.2); }
        .level-card.unlocked:active { transform: scale(0.97); background: rgba(0,229,255,0.1); }
        .level-card.locked { opacity: 0.5; cursor: not-allowed; }
        .level-info { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: bold; }
        .level-stars { color: var(--gold); font-size: 18px; letter-spacing: 2px; }

        /* In-Game UI */
        #gameUI { position: absolute; top: 15px; left: 15px; right: 15px; display: none; justify-content: space-between; font-weight: bold; font-size: 16px; color: white; text-shadow: 1px 1px 4px black, 0 0 5px var(--neon-blue); z-index: 10; }
        .controls { position: absolute; bottom: 20px; width: 100%; display: none; justify-content: space-evenly; z-index: 10; }
        button.ctrl-btn { 
            width: 65px; height: 65px; border-radius: 50%; font-size: 22px; border: 2px solid rgba(255,255,255,0.4); 
            background: rgba(0,0,0,0.4); color: white; font-weight: bold; cursor: pointer; user-select: none; 
            touch-action: manipulation; transition: all 0.1s; backdrop-filter: blur(4px); box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        button.ctrl-btn:active { background: rgba(0, 229, 255, 0.6); color: white; border-color: var(--neon-blue); transform: translateY(2px); box-shadow: 0 0 15px var(--neon-blue); }

        /* Music Toggle */
        .music-toggle { position: absolute; top: 10px; right: 10px; z-index: 50; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 5px 15px; color: white; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px); transition: all 0.2s; }
        .music-toggle:active { transform: scale(0.9); border-color: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }

        /* --- NEW: Unlock Cinematic Screen --- */
        #unlockScreen {
            background: radial-gradient(circle, rgba(30,10,40,0.98) 0%, rgba(10,5,15,0.98) 100%);
        }
        .padlock-wrapper { position: relative; margin-bottom: 50px; }
        .padlock {
            position: relative; width: 70px; height: 50px;
            background: linear-gradient(to bottom, #ffd700, #ffaa00);
            border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.5);
            display: flex; justify-content: center; align-items: center; z-index: 2;
        }
        .padlock::after {
            content: ''; width: 12px; height: 18px; background: #222; border-radius: 6px 6px 4px 4px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }
        .padlock-shackle {
            position: absolute; top: -35px; left: 10px; width: 50px; height: 40px;
            border: 10px solid #d4d4d4; border-bottom: none; border-radius: 25px 25px 0 0;
            box-sizing: border-box; z-index: 1; transform-origin: right bottom;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .padlock-wrapper.shaking { animation: padlockShake 0.1s infinite; }
        @keyframes padlockShake {
            0%, 100% { transform: translate(0, 0) rotate(0); }
            25% { transform: translate(-4px, 2px) rotate(-4deg); }
            75% { transform: translate(4px, -2px) rotate(4deg); }
        }
        .padlock-wrapper.unlocking .padlock-shackle {
            transform: translateY(-25px) rotate(25deg);
        }

        #unlockText { font-size: 32px; font-weight: 900; color: var(--neon-blue); text-shadow: 0 0 15px var(--neon-blue), 0 0 30px var(--neon-blue); opacity: 0; transition: opacity 0.5s; text-align: center; margin-bottom: 30px; letter-spacing: 2px;}
        #btnContinueUnlock { opacity: 0; transition: opacity 0.5s; pointer-events: none; }


        /* Stage Clear & Game Over Overlays */
        #stageClearScreen h1 { color: var(--gold); text-shadow: 0 0 20px var(--gold); font-size: 36px; margin: 0; text-align: center; }
        #gameOverScreen h1 { color: var(--neon-pink); text-shadow: 0 0 20px var(--neon-pink); font-size: 40px; margin: 0; }
        .stats-box { background: rgba(0,0,0,0.6); padding: 20px; border-radius: 15px; margin: 20px 0; border: 1px solid rgba(255,255,255,0.2); width: 75%; text-align: center; }
        .stats-box p { margin: 5px 0; color: #aaa; font-size: 14px; }
        .stats-box .val { color: white; font-size: 24px; font-weight: bold; text-shadow: 0 0 5px rgba(255,255,255,0.5); margin-bottom: 15px; }
        
        .big-stars { display: flex; justify-content: center; gap: 10px; margin: 15px 0; font-size: 40px; color: #444; }
        .big-stars span { opacity: 0; transform: scale(0.5); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .big-stars span.earned { color: var(--gold); text-shadow: 0 0 15px var(--gold); opacity: 1; transform: scale(1); }
        
        .button-group { display: flex; flex-direction: column; gap: 10px; width: 80%; }
        
    </style>
</head>
<body>
    <div id="game-container">
        <!-- BGM Toggle Button -->
        <button class="music-toggle" id="btnMusicToggle">🔇 OFF</button>

        <!-- Canvas -->
        <canvas id="gameCanvas" width="360" height="640"></canvas>
        
        <!-- In-Game UI -->
        <div id="gameUI">
            <span id="uiLevelText">🌍 Stage 1</span>
            <span id="uiTimerText">0.00s</span>
        </div>
        
        <!-- Controls -->
        <div class="controls" id="controlsDiv">
            <button class="ctrl-btn" id="btnLeft">←</button>
            <button class="ctrl-btn" id="btnJump">↑</button>
            <button class="ctrl-btn" id="btnRight">→</button>
        </div>

        <!-- 1. Start Screen -->
        <div id="startScreen" class="overlay active">
            <div class="logo-container">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%; filter: drop-shadow(0 0 10px #00e5ff);">
                    <polygon points="50,5 95,30 95,70 50,95 5,70 5,30" stroke="#00e5ff" stroke-width="4" fill="rgba(0, 229, 255, 0.1)"/>
                    <polygon points="50,20 80,38 80,62 50,80 20,62 20,38" stroke="#ff007f" stroke-width="3" fill="rgba(255, 0, 127, 0.15)"/>
                    <circle cx="50" cy="50" r="10" fill="#00e5ff" />
                </svg>
            </div>
            <h1 class="title">NEON<br>OBBY</h1>
            <p class="subtitle">Speedrun the galaxy.<br>Get 3 stars by beating the clock.</p>
            <button class="btn-action" onclick="showScreen('levelSelectScreen')">PLAY</button>
        </div>

        <!-- 2. Level Select Screen -->
        <div id="levelSelectScreen" class="overlay">
            <h2>SELECT STAGE</h2>
            <div class="level-grid" id="levelGrid">
                <!-- Injected via JS -->
            </div>
            <button class="btn-action pink" style="margin-top: 30px; padding: 10px 30px; font-size:14px;" onclick="showScreen('startScreen')">BACK</button>
        </div>

        <!-- 3. Cinematic Unlock Screen -->
        <div id="unlockScreen" class="overlay">
            <div class="padlock-wrapper" id="padlockWrapper">
                <div class="padlock-shackle"></div>
                <div class="padlock"></div>
            </div>
            <div id="unlockText">NEW LEVEL<br>UNLOCKED!</div>
            <button class="btn-action pink" id="btnContinueUnlock" onclick="showStageClearStats()">CONTINUE</button>
        </div>

        <!-- 4. Stage Clear Screen -->
        <div id="stageClearScreen" class="overlay">
            <h1>STAGE CLEAR!</h1>
            <div class="stats-box">
                <p>CLEAR TIME</p>
                <div class="val" id="clearTimeDisplay">0.00s</div>
                
                <div class="big-stars" id="clearStarsDisplay">
                    <span id="star1">★</span>
                    <span id="star2">★</span>
                    <span id="star3">★</span>
                </div>
                <p id="starHintText" style="color:var(--neon-blue); font-size:12px;">Target: 15s for 3 Stars</p>
            </div>
            <div class="button-group">
                <button class="btn-action gold" id="btnNextLevel" onclick="nextLevel()">NEXT LEVEL</button>
                <button class="btn-action" onclick="goToMenu()">LEVEL SELECT</button>
            </div>
        </div>

        <!-- 5. Game Over Screen -->
        <div id="gameOverScreen" class="overlay">
            <h1>WASTED</h1>
            <p style="color:#aaa; margin-bottom: 30px;">You fell into the abyss.</p>
            <div class="button-group">
                <button class="btn-action pink" onclick="restartLevel()">TRY AGAIN</button>
                <button class="btn-action" onclick="goToMenu()">LEVEL SELECT</button>
            </div>
        </div>
    </div>

    <script>
        // ================= Core DOM Elements =================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('game-container');
        const uiDiv = document.getElementById('gameUI');
        const controlsDiv = document.getElementById('controlsDiv');
        
        // ================= System State =================
        let gameState = 'START'; // START, MENU, PLAYING, GAMEOVER, STAGE_CLEAR, UNLOCK_SCENE
        let currentLevel = 0;
        let startTime = 0;
        let totalElapsedTime = 0;
        let cameraY = 0;
        let tempClearStats = null; // Store stats for passing between scenes

        // ================= Audio System (AudioContext) =================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMusicPlaying = false;
        let musicInitialized = false;
        const btnMusicToggle = document.getElementById('btnMusicToggle');

        // 8-bit Sequencer variables
        let currentNote = 0;
        let nextNoteTime = 0;
        const tempo = 150; // bpm
        const lookahead = 25; // ms
        const scheduleAheadTime = 0.1; // s
        let timerID;

        // Catchy 8-bit Arpeggio Melody
        const melody = [
            329.63, 392.00, 493.88, 659.25, // E G B E
            261.63, 329.63, 392.00, 523.25, // C E G C
            293.66, 369.99, 440.00, 587.33, // D F# A D
            246.94, 329.63, 392.00, 493.88  // B E G B
        ];

        function nextNote() {
            const secondsPerBeat = 60.0 / (tempo * 2);
            nextNoteTime += secondsPerBeat;
            currentNote = (currentNote + 1) % melody.length;
        }

        function scheduleNote(noteFreq, time) {
            if (!isMusicPlaying) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square'; // 8-bit waveform
            osc.frequency.value = noteFreq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            // 8-bit plucky envelope
            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.05, time + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
            
            osc.start(time);
            osc.stop(time + 0.15);
        }

        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                scheduleNote(melody[currentNote], nextNoteTime);
                nextNote();
            }
            if (isMusicPlaying) {
                timerID = setTimeout(scheduler, lookahead);
            }
        }

        function startMusic() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (isMusicPlaying) return;
            isMusicPlaying = true;
            musicInitialized = true;
            
            btnMusicToggle.innerText = '🎵 ON';
            btnMusicToggle.style.borderColor = 'var(--neon-blue)';
            btnMusicToggle.style.boxShadow = '0 0 10px var(--neon-blue)';
            
            if (nextNoteTime === 0 || nextNoteTime < audioCtx.currentTime) {
                nextNoteTime = audioCtx.currentTime + 0.05;
            }
            scheduler();
        }

        function stopMusic() {
            isMusicPlaying = false;
            clearTimeout(timerID);
            
            btnMusicToggle.innerText = '🔇 OFF';
            btnMusicToggle.style.borderColor = 'rgba(255,255,255,0.3)';
            btnMusicToggle.style.boxShadow = 'none';
        }

        btnMusicToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isMusicPlaying) {
                stopMusic();
            } else {
                startMusic();
            }
        });

        // Initialize music on first interaction anywhere
        document.body.addEventListener('click', () => {
            if (!musicInitialized) startMusic();
        }, { once: true });
        
        document.body.addEventListener('touchstart', () => {
            if (!musicInitialized) startMusic();
        }, { once: true });

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'jump') {
                osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'land') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(80, now);
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'death') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'clear' || type === 'star') {
                osc.type = 'sine'; 
                const freq = type === 'clear' ? 400 : 800;
                osc.frequency.setValueAtTime(freq, now); osc.frequency.exponentialRampToValueAtTime(freq*2, now + 0.2);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'shake') {
                // Low rumbling noise for shaking padlock
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(50, now);
                gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'padlock_open') {
                // Triumphant pop
                osc.type = 'square'; 
                [500, 700, 1000].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i*0.1));
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
        }

        // ================= Progression & Save System =================
        let progress = JSON.parse(localStorage.getItem('obbyProgressV3')) || {
            0: { unlocked: true, stars: 0 },
            1: { unlocked: false, stars: 0 },
            2: { unlocked: false, stars: 0 }
        };

        function saveProgress() {
            localStorage.setItem('obbyProgressV3', JSON.stringify(progress));
        }

        // ================= Level Configuration =================
        const levelsData = [
            { 
                emoji: '🌍', name: 'Earth Orbit',
                bgUrl: 'https://images.unsplash.com/photo-1534796636912-3652c7435f0f?q=80&w=400&fit=crop',
                starTargets: [15, 25], // < 15s = 3 stars, < 25s = 2 stars, else 1 star
                height: 640, spawnX: 40, spawnY: 550,
                objects: [
                    { x: 0, y: 580, w: 360, h: 60, type: 'ground' },
                    { x: 120, y: 480, w: 60, h: 10, type: 'ground' },
                    { x: 220, y: 380, w: 60, h: 10, type: 'ground' },
                    { x: 100, y: 280, w: 60, h: 10, type: 'ground' },
                    { x: 200, y: 180, w: 60, h: 10, type: 'ground' },
                    { x: 140, y: 80, w: 80, h: 15, type: 'goal' }
                ]
            },
            { 
                emoji: '🌕', name: 'Lunar Base',
                bgUrl: 'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=400&fit=crop',
                starTargets: [18, 30],
                height: 1200, spawnX: 40, spawnY: 1110,
                objects: [
                    { x: 0, y: 1140, w: 100, h: 60, type: 'ground' },
                    { x: 100, y: 1180, w: 260, h: 20, type: 'lava' },
                    { x: 150, y: 1040, w: 50, h: 10, type: 'ground' },
                    { x: 50, y: 930, w: 60, h: 10, type: 'ground', moving: true, speedX: 1.5, minX: 20, maxX: 200 },
                    { x: 250, y: 820, w: 50, h: 10, type: 'ground' },
                    { x: 150, y: 710, w: 60, h: 10, type: 'ground', moving: true, speedX: -2.5, minX: 50, maxX: 300 },
                    { x: 50, y: 600, w: 40, h: 10, type: 'ground' },
                    { x: 180, y: 490, w: 40, h: 10, type: 'ground' },
                    { x: 250, y: 380, w: 40, h: 10, type: 'ground' },
                    { x: 120, y: 270, w: 40, h: 10, type: 'ground' },
                    { x: 200, y: 160, w: 40, h: 10, type: 'ground' },
                    { x: 140, y: 60, w: 80, h: 15, type: 'goal' }
                ]
            },
            { 
                emoji: '🪐', name: 'Saturn Rings',
                bgUrl: 'https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?q=80&w=400&fit=crop',
                starTargets: [25, 40],
                height: 1800, spawnX: 40, spawnY: 1720,
                objects: [
                    { x: 0, y: 1750, w: 100, h: 50, type: 'ground' },
                    { x: 0, y: 1790, w: 360, h: 10, type: 'lava' },
                    { x: 150, y: 1640, w: 40, h: 10, type: 'ground' },
                    { x: 270, y: 1530, w: 40, h: 10, type: 'ground' },
                    { x: 100, y: 1420, w: 40, h: 10, type: 'ground', moving: true, speedX: 2, minX: 50, maxX: 250 },
                    { x: 40, y: 1310, w: 40, h: 10, type: 'ground' },
                    { x: 160, y: 1200, w: 30, h: 10, type: 'ground' },
                    { x: 250, y: 1090, w: 30, h: 10, type: 'ground' },
                    { x: 50, y: 1030, w: 50, h: 15, type: 'lava', moving: true, speedX: 3.5, minX: 20, maxX: 220 },
                    { x: 100, y: 980, w: 30, h: 10, type: 'ground' },
                    { x: 220, y: 870, w: 30, h: 10, type: 'ground' },
                    { x: 120, y: 760, w: 40, h: 10, type: 'ground', moving: true, speedX: 1.5, minX: 100, maxX: 300 },
                    { x: 50, y: 650, w: 30, h: 10, type: 'ground' },
                    { x: 150, y: 540, w: 30, h: 10, type: 'ground' },
                    { x: 260, y: 430, w: 30, h: 10, type: 'ground' },
                    { x: 140, y: 320, w: 30, h: 10, type: 'ground' },
                    { x: 220, y: 210, w: 30, h: 10, type: 'ground' },
                    { x: 120, y: 100, w: 30, h: 10, type: 'ground' },
                    { x: 140, y: 40, w: 80, h: 15, type: 'goal' }
                ]
            }
        ];

        // ================= UI & Screen Management =================
        function showScreen(screenId) {
            document.querySelectorAll('.overlay').forEach(el => el.classList.remove('active'));
            if (screenId) document.getElementById(screenId).classList.add('active');
            
            if (screenId === 'levelSelectScreen') {
                renderLevelSelect();
                gameState = 'MENU';
                gameContainer.style.backgroundImage = `url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=400&fit=crop')`; 
            }
        }

        function renderLevelSelect() {
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            
            levelsData.forEach((lvl, idx) => {
                const isUnlocked = progress[idx] && progress[idx].unlocked;
                const stars = progress[idx] ? progress[idx].stars : 0;
                
                const btn = document.createElement('div');
                btn.className = `level-card ${isUnlocked ? 'unlocked' : 'locked'}`;
                
                let starHtml = '';
                if(isUnlocked) {
                    starHtml = (stars >= 1 ? '★' : '☆') + (stars >= 2 ? '★' : '☆') + (stars >= 3 ? '★' : '☆');
                } else {
                    starHtml = '🔒';
                }

                btn.innerHTML = `
                    <div class="level-info">
                        <span>${lvl.emoji}</span>
                        <span>${idx + 1}. ${lvl.name}</span>
                    </div>
                    <div class="level-stars">${starHtml}</div>
                `;
                
                if (isUnlocked) {
                    btn.onclick = () => loadLevel(idx);
                }
                grid.appendChild(btn);
            });
        }

        function loadLevel(idx) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            currentLevel = idx;
            showScreen(null); 
            uiDiv.style.display = 'flex';
            controlsDiv.style.display = 'flex';
            
            let data = levelsData[currentLevel];
            gameContainer.style.backgroundImage = `url('${data.bgUrl}')`;
            document.getElementById('uiLevelText').innerText = `${data.emoji} Stage ${currentLevel + 1}`;
            
            restartLevel();
        }

        function goToMenu() {
            uiDiv.style.display = 'none';
            controlsDiv.style.display = 'none';
            particles = []; 
            showScreen('levelSelectScreen');
        }

        function restartLevel() {
            keys.left = false; keys.right = false; keys.jump = false;
            let data = levelsData[currentLevel];
            levelObjects = data.objects.map(obj => ({...obj}));
            player.x = data.spawnX; player.y = data.spawnY;
            player.dx = 0; player.dy = 0; player.currentPlatform = null;
            
            particles = []; 
            startTime = Date.now();
            gameState = 'PLAYING';
            showScreen(null); 
        }

        function nextLevel() {
            if (currentLevel + 1 < levelsData.length) {
                loadLevel(currentLevel + 1);
            } else {
                goToMenu(); 
            }
        }

        // ================= Game Logic & Physics =================
        const player = {
            x: 0, y: 0, w: 20, h: 20, color: '#00e5ff',
            dx: 0, dy: 0, speed: 4.5, jumpPower: -12,
            gravity: 0.45, grounded: false, currentPlatform: null
        };
        let levelObjects = []; 
        let particles = [];

        function spawnConfetti() {
            for(let i=0; i<60; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + cameraY, 
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 1.0,
                    color: ['#00e5ff', '#ff007f', '#ffd700', '#fff'][Math.floor(Math.random()*4)],
                    size: Math.random() * 4 + 2
                });
            }
        }

        const keys = { left: false, right: false, jump: false };
        const bindKey = (e, state) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = state;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = state;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.jump = state;
        };
        window.addEventListener('keydown', e => bindKey(e, true));
        window.addEventListener('keyup', e => bindKey(e, false));

        const setupBtn = (id, key) => {
            const btn = document.getElementById(id);
            const setTrue = (e) => { e.preventDefault(); keys[key] = true; };
            const setFalse = (e) => { e.preventDefault(); keys[key] = false; };
            btn.addEventListener('mousedown', setTrue);
            btn.addEventListener('mouseup', setFalse);
            btn.addEventListener('mouseleave', setFalse);
            btn.addEventListener('touchstart', setTrue, {passive: false});
            btn.addEventListener('touchend', setFalse, {passive: false});
            btn.addEventListener('touchcancel', setFalse, {passive: false});
        };
        setupBtn('btnLeft', 'left'); setupBtn('btnRight', 'right'); setupBtn('btnJump', 'jump');

        function triggerStageClear() {
            // 1. Calculate Stats
            let targets = levelsData[currentLevel].starTargets;
            let earnedStars = 1;
            if (totalElapsedTime <= targets[0]) earnedStars = 3;
            else if (totalElapsedTime <= targets[1]) earnedStars = 2;

            // 2. Check for New Unlock
            let nextLevelIdx = currentLevel + 1;
            let isNewUnlock = false;

            if (!progress[currentLevel]) progress[currentLevel] = { unlocked: true, stars: 0 };
            progress[currentLevel].stars = Math.max(progress[currentLevel].stars, earnedStars);
            
            if (nextLevelIdx < levelsData.length) {
                if (!progress[nextLevelIdx] || !progress[nextLevelIdx].unlocked) {
                    isNewUnlock = true;
                    if (!progress[nextLevelIdx]) progress[nextLevelIdx] = { unlocked: true, stars: 0 };
                    else progress[nextLevelIdx].unlocked = true;
                }
            }
            saveProgress();

            // 3. Save stats for the next screen
            tempClearStats = { time: totalElapsedTime, stars: earnedStars, targets: targets };

            // 4. Route to correct screen
            if (isNewUnlock) {
                playUnlockCinematic();
            } else {
                showStageClearStats();
            }
        }

        // --- Cinematic Logic ---
        function playUnlockCinematic() {
            gameState = 'UNLOCK_SCENE';
            uiDiv.style.display = 'none';
            controlsDiv.style.display = 'none';
            
            const wrapper = document.getElementById('padlockWrapper');
            const text = document.getElementById('unlockText');
            const btn = document.getElementById('btnContinueUnlock');
            
            // Reset state
            wrapper.className = 'padlock-wrapper shaking';
            text.style.opacity = '0';
            btn.style.opacity = '0';
            btn.style.pointerEvents = 'none';
            
            showScreen('unlockScreen');
            
            // Play intense rumbling
            let shakeInterval = setInterval(() => playSound('shake'), 100);

            // Pop unlock after 1.5 seconds
            setTimeout(() => {
                clearInterval(shakeInterval);
                wrapper.className = 'padlock-wrapper unlocking';
                playSound('padlock_open');
                
                text.style.opacity = '1';
                
                setTimeout(() => {
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                }, 1000); // Wait 1 sec before letting them click continue
                
            }, 1500); 
        }

        function showStageClearStats() {
            gameState = 'STAGE_CLEAR';
            uiDiv.style.display = 'none';
            controlsDiv.style.display = 'none';
            
            playSound('clear');
            spawnConfetti();
            
            let stats = tempClearStats;

            // Show UI
            document.getElementById('clearTimeDisplay').innerText = stats.time.toFixed(2) + 's';
            document.getElementById('starHintText').innerText = `Target: ${stats.targets[0]}s (3★) / ${stats.targets[1]}s (2★)`;
            
            // Hide next button if last stage
            document.getElementById('btnNextLevel').style.display = (currentLevel + 1 < levelsData.length) ? 'block' : 'none';
            
            showScreen('stageClearScreen');

            // Animate Stars Pop
            const starsSpans = [document.getElementById('star1'), document.getElementById('star2'), document.getElementById('star3')];
            starsSpans.forEach(s => s.className = ''); // reset
            
            for(let i=0; i<stats.stars; i++) {
                setTimeout(() => {
                    starsSpans[i].className = 'earned';
                    playSound('star');
                }, 500 + (i * 300)); 
            }
        }

        function update() {
            // Update particles regardless of state
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.2; 
                p.life -= 0.01;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (gameState !== 'PLAYING') return;

            totalElapsedTime = (Date.now() - startTime) / 1000;
            document.getElementById('uiTimerText').innerText = totalElapsedTime.toFixed(2) + 's';
            
            let lvlData = levelsData[currentLevel];

            for (let rect of levelObjects) {
                if (rect.moving) {
                    rect.x += rect.speedX;
                    if (rect.x <= rect.minX || rect.x + rect.w >= rect.maxX) rect.speedX *= -1;
                }
            }

            if (keys.left) player.dx = -player.speed;
            else if (keys.right) player.dx = player.speed;
            else player.dx = 0;

            if (player.currentPlatform && player.currentPlatform.moving) player.dx += player.currentPlatform.speedX;

            if (keys.jump && player.grounded) {
                player.dy = player.jumpPower; player.grounded = false; player.currentPlatform = null; playSound('jump');
            }

            player.dy += player.gravity; player.x += player.dx; player.y += player.dy;

            // Boundaries
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;
            if (player.y > lvlData.height + 50) { 
                playSound('death'); 
                gameState = 'GAMEOVER'; 
                showScreen('gameOverScreen');
            }

            let wasGrounded = player.grounded;
            player.grounded = false; player.currentPlatform = null;

            // Collisions
            for (let rect of levelObjects) {
                if (player.x < rect.x + rect.w && player.x + player.w > rect.x &&
                    player.y < rect.y + rect.h && player.y + player.h > rect.y) {
                    
                    if (rect.type === 'lava') {
                        playSound('death'); gameState = 'GAMEOVER'; showScreen('gameOverScreen');
                    } else if (rect.type === 'goal') {
                        triggerStageClear();
                    } else if (rect.type === 'ground') {
                        if (player.dy > 0 && (player.y + player.h - player.dy) <= rect.y + 12) {
                            player.grounded = true; player.currentPlatform = rect; player.dy = 0; player.y = rect.y - player.h;
                            if (!wasGrounded) playSound('land'); 
                        } else if (player.dy < 0 && (player.y - player.dy) >= rect.y + rect.h - 5) {
                            player.dy = 0; player.y = rect.y + rect.h;
                        }
                    }
                }
            }

            // Camera follow
            let targetCameraY = player.y - canvas.height / 2;
            targetCameraY = Math.max(0, Math.min(targetCameraY, lvlData.height - canvas.height));
            cameraY += (targetCameraY - cameraY) * 0.1;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'START' || gameState === 'MENU') return;

            ctx.save();
            ctx.translate(0, -cameraY);

            for (let rect of levelObjects) {
                if (rect.type === 'ground') ctx.fillStyle = rect.moving ? '#444' : '#222';
                if (rect.type === 'lava') ctx.fillStyle = rect.moving ? '#ff007f' : '#b30059'; 
                
                if (rect.type === 'goal') {
                    ctx.fillStyle = '#ffd700';
                    ctx.shadowBlur = 20; ctx.shadowColor = '#ffd700'; 
                } else if (rect.type === 'lava') {
                    ctx.shadowBlur = 10; ctx.shadowColor = '#ff007f';
                }
                
                ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
                ctx.shadowBlur = 0; 
                
                if(rect.type === 'ground') {
                    ctx.strokeStyle = rect.moving ? '#00e5ff' : '#0088aa';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
                    ctx.fillStyle = 'rgba(0, 229, 255, 0.1)';
                    ctx.fillRect(rect.x, rect.y, rect.w, 4); 
                }
            }

            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15; ctx.shadowColor = player.color;
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.shadowBlur = 0;

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            ctx.restore();
        }

        function gameLoop() { 
            update(); 
            draw(); 
            requestAnimationFrame(gameLoop); 
        }
        
        gameLoop(); 
    </script>
</body>
</html>
