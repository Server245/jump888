<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไซเบอร์ รันเนอร์ - ภารกิจโจรกรรมข้อมูล</title>
    <style>
        body { margin: 0; background-color: #05050a; display: flex; justify-content: center; align-items: center; height: 100vh; color: #00ffff; font-family: 'Courier New', Tahoma, sans-serif; overflow: hidden; }
        #game-container { position: relative; width: 360px; height: 640px; border: 2px solid #00ffff; border-radius: 8px; overflow: hidden; box-shadow: 0 0 40px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(0, 255, 255, 0.1); background-color: #0a0a12; }
        canvas { display: block; }
        
        #ui { position: absolute; top: 15px; left: 15px; right: 15px; display: none; justify-content: space-between; align-items: flex-start; font-weight: bold; font-size: 14px; color: #00ffff; text-shadow: 0 0 5px #00ffff; z-index: 10; }
        .ui-left { display: flex; flex-direction: column; gap: 5px; }
        .data-text { color: #ccff00; text-shadow: 0 0 8px #ccff00; }
        #btnPause { background: rgba(0, 255, 255, 0.1); border: 1px solid #00ffff; color: #00ffff; font-family: 'Courier New', Tahoma, sans-serif; font-weight: bold; font-size: 14px; padding: 5px 10px; cursor: pointer; border-radius: 4px; box-shadow: 0 0 5px rgba(0,255,255,0.3); }
        #btnPause:active { background: #00ffff; color: #000; }

        .controls { position: absolute; bottom: 20px; width: 100%; display: none; justify-content: space-evenly; z-index: 10; }
        button.ctrl-btn { width: 60px; height: 60px; border-radius: 8px; font-size: 20px; border: 2px solid #00ffff; background: rgba(0, 255, 255, 0.1); color: #00ffff; font-family: 'Courier New', Tahoma, sans-serif; font-weight: bold; cursor: pointer; user-select: none; touch-action: manipulation; }
        button.ctrl-btn:active { background: #00ffff; color: #000; }

        .overlay-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        
        #startScreen { background: linear-gradient(180deg, #05050a 0%, #1a0b2e 100%); }
        #levelSelectScreen { background: rgba(5, 5, 10, 0.95); backdrop-filter: blur(5px); display: none; z-index: 25; }
        #pauseScreen { background: rgba(0, 0, 0, 0.85); display: none; z-index: 30; backdrop-filter: blur(3px); }
        #endScreen { background: rgba(5, 5, 10, 0.95); display: none; z-index: 30; backdrop-filter: blur(5px); border: 2px solid #ff00ff; }

        h1 { margin: 0; font-size: 36px; color: #ff00ff; text-shadow: 0 0 15px #ff00ff; text-align: center; }
        p.subtitle { color: #00ffff; margin-top: 15px; font-size: 14px; text-align: center; line-height: 1.6; }
        
        .lvl-btn { display: flex; justify-content: space-between; align-items: center; width: 260px; padding: 15px; margin: 10px 0; border: 2px solid #ff0055; background: rgba(255, 0, 85, 0.05); color: #ff0055; cursor: not-allowed; font-weight: bold; font-family: 'Courier New', Tahoma, sans-serif; font-size: 16px; transition: all 0.3s; }
        .lvl-btn.unlocked { border-color: #00ffaa; background: rgba(0, 255, 170, 0.1); color: #00ffaa; cursor: pointer; }
        .lvl-btn.unlocked:hover { background: rgba(0, 255, 170, 0.3); box-shadow: 0 0 15px rgba(0, 255, 170, 0.4); }
        .lvl-btn.unlocked:active { background: #00ffaa; color: #000; }
        
        .unlock-anim { animation: unlockFlash 1s ease-out forwards; }
        @keyframes unlockFlash { 
            0% { background: #fff; border-color: #fff; color: #000; box-shadow: 0 0 30px #fff; } 
            20% { background: #00ffaa; color: #000; } 
            100% { border-color: #00ffaa; background: rgba(0, 255, 170, 0.2); color: #00ffaa; box-shadow: 0 0 15px rgba(0,255,170,0.5); } 
        }

        .btn-action { margin-top: 20px; padding: 12px 30px; font-size: 18px; font-weight: bold; border: 2px solid #ff00ff; background: rgba(255, 0, 255, 0.1); color: #ff00ff; cursor: pointer; font-family: 'Courier New', Tahoma, sans-serif; transition: 0.2s; }
        .btn-action:active { background: #ff00ff; color: #000; }
        .btn-alt { border-color: #00ffff; color: #00ffff; background: rgba(0,255,255,0.1); }
        .btn-alt:active { background: #00ffff; color: #000; }

        .stats-box { background: rgba(0, 255, 255, 0.05); padding: 20px; border-radius: 8px; margin: 20px 0; border: 1px solid #00ffff; width: 70%; text-align: center; }
        .stats-box .score-val { color: #ccff00; font-size: 28px; text-shadow: 0 0 10px #ccff00; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="360" height="640"></canvas>
        
        <div id="ui">
            <div class="ui-left">
                <span id="levelText">ด่าน: 1/4</span>
                <span id="dataText" class="data-text">ข้อมูล: 0/3</span>
            </div>
            <span id="timerText">เวลา: 0.00วิ</span>
            <button id="btnPause">|| หยุด</button>
        </div>
        <div class="controls" id="controlsDiv">
            <button class="ctrl-btn" id="btnLeft">&lt;</button>
            <button class="ctrl-btn" id="btnJump">^</button>
            <button class="ctrl-btn" id="btnRight">&gt;</button>
        </div>

        <div id="startScreen" class="overlay-screen">
            <h1>ไซเบอร์ รันเนอร์</h1>
            <p class="subtitle">> แฮกเข้าสู่ระบบศูนย์กลาง<br>> บังคับ: WASD / ลูกศร / ทัชสกรีน</p>
            <button class="btn-action" id="btnStart">เชื่อมต่อระบบ</button>
        </div>

        <div id="levelSelectScreen" class="overlay-screen">
            <h1 style="font-size: 28px; margin-bottom: 20px; color: #00ffff; text-shadow: 0 0 10px #00ffff;">เลือกภารกิจ</h1>
            <div id="lvlBtnContainer" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            </div>
        </div>

        <div id="pauseScreen" class="overlay-screen">
            <h1 style="color:#00ffff; text-shadow:0 0 15px #00ffff; font-size: 28px;">ระบบหยุดชั่วคราว</h1>
            <button class="btn-action btn-alt" id="btnResume" style="margin-top:40px;">ดำเนินการต่อ</button>
            <button class="btn-action" id="btnQuitMenu">กลับสู่เมนูหลัก</button>
        </div>

        <div id="endScreen" class="overlay-screen">
            <h1 style="font-size: 32px;">ยึดครองระบบสำเร็จ!</h1>
            <div class="stats-box">
                <p style="color:#aaa; font-size:16px;">เวลาที่ใช้ทั้งหมด</p>
                <span id="finalTimeDisplay" style="color:#ff00ff; font-size:24px;">0.00วิ</span>
                <p style="margin-top:20px; color:#aaa;">คะแนนการแฮก</p>
                <span class="score-val" id="finalScoreDisplay">0</span>
            </div>
            <button class="btn-action btn-alt" id="btnRestart">เริ่มระบบใหม่</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiDiv = document.getElementById('ui');
        const controlsDiv = document.getElementById('controlsDiv');
        
        const startScreen = document.getElementById('startScreen');
        const levelSelectScreen = document.getElementById('levelSelectScreen');
        const pauseScreen = document.getElementById('pauseScreen');
        const endScreen = document.getElementById('endScreen');

        // ================= ระบบเสียง =================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'jump') {
                osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'land') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(100, now);
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'item') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'unlock') {
                osc.type = 'square'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(600, now + 0.3);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'padlock') {
                osc.type = 'square'; osc.frequency.setValueAtTime(1200, now); osc.frequency.setValueAtTime(1600, now + 0.1); osc.frequency.setValueAtTime(2000, now + 0.2);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'death') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'clear') {
                osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now + 0.1); osc.frequency.setValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        let backgroundOffset = 0;
        let gameState = 'MENU'; 
        let currentLevel = 0;
        let highestUnlocked = 1; 
        let newlyUnlockedLevel = -1; 
        let totalElapsedTime = 0;
        let lastTime = 0; 
        let cameraY = 0;
        let dataCollected = 0;
        let terminalUnlocked = false;

        const keys = { left: false, right: false, jump: false };
        const bindKey = (e, state) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = state;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = state;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.jump = state;
        };
        window.addEventListener('keydown', e => bindKey(e, true));
        window.addEventListener('keyup', e => bindKey(e, false));

        const setupBtn = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('mousedown', () => keys[key] = true);
            btn.addEventListener('mouseup', () => keys[key] = false);
            btn.addEventListener('mouseleave', () => keys[key] = false);
            btn.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
        };
        setupBtn('btnLeft', 'left'); setupBtn('btnRight', 'right'); setupBtn('btnJump', 'jump');

        const player = {
            x: 0, y: 0, w: 20, h: 20, color: '#ff00ff',
            dx: 0, dy: 0, speed: 4.5, jumpPower: -12,
            gravity: 0.45, grounded: false, currentPlatform: null
        };

        let levelObjects = []; 
        let levelItems = [];
        const levelsData = [
            { height: 1000, spawnX: 170, spawnY: 950, items: [{x: 120, y: 820}, {x: 220, y: 580}, {x: 120, y: 340}], objects: [
                { x: 0, y: 980, w: 360, h: 20, type: 'ground' }, { x: 100, y: 860, w: 60, h: 10, type: 'ground' }, { x: 200, y: 740, w: 60, h: 10, type: 'ground' }, { x: 100, y: 620, w: 60, h: 10, type: 'ground' }, { x: 200, y: 500, w: 60, h: 10, type: 'ground' }, { x: 100, y: 380, w: 60, h: 10, type: 'ground' }, { x: 200, y: 260, w: 60, h: 10, type: 'ground' }, { x: 120, y: 140, w: 120, h: 15, type: 'goal' }
            ]},
            { height: 1400, spawnX: 40, spawnY: 1350, items: [{x: 170, y: 1210}, {x: 270, y: 960}, {x: 120, y: 840}, {x: 70, y: 460}], objects: [
                { x: 0, y: 1380, w: 100, h: 20, type: 'ground' }, { x: 100, y: 1380, w: 260, h: 20, type: 'lava' }, { x: 150, y: 1250, w: 60, h: 10, type: 'ground' }, { x: 50, y: 1120, w: 60, h: 10, type: 'ground', moving: true, speedX: 1.5, minX: 20, maxX: 200 }, { x: 250, y: 1000, w: 60, h: 10, type: 'ground' }, { x: 200, y: 980, w: 10, h: 40, type: 'lava' }, { x: 100, y: 880, w: 60, h: 10, type: 'ground' }, { x: 100, y: 750, w: 60, h: 10, type: 'ground', moving: true, speedX: -2, minX: 50, maxX: 300 }, { x: 200, y: 620, w: 60, h: 10, type: 'ground' }, { x: 50, y: 500, w: 60, h: 10, type: 'ground' }, { x: 150, y: 380, w: 60, h: 10, type: 'ground' }, { x: 250, y: 260, w: 60, h: 10, type: 'ground' }, { x: 120, y: 120, w: 120, h: 15, type: 'goal' }
            ]},
            { height: 1800, spawnX: 40, spawnY: 1750, items: [{x: 280, y: 1490}, {x: 60, y: 1230}, {x: 110, y: 970}, {x: 230, y: 830}, {x: 270, y: 310}], objects: [
                { x: 0, y: 1780, w: 100, h: 20, type: 'ground' }, { x: 0, y: 1790, w: 360, h: 10, type: 'lava' }, { x: 150, y: 1650, w: 50, h: 10, type: 'ground' }, { x: 270, y: 1530, w: 50, h: 10, type: 'ground' }, { x: 100, y: 1400, w: 50, h: 10, type: 'ground', moving: true, speedX: 2.5, minX: 50, maxX: 250 }, { x: 40, y: 1270, w: 50, h: 10, type: 'ground' }, { x: 50, y: 1200, w: 150, h: 10, type: 'lava' }, { x: 250, y: 1140, w: 50, h: 10, type: 'ground' }, { x: 100, y: 1010, w: 50, h: 10, type: 'ground' }, { x: 50, y: 950, w: 50, h: 10, type: 'lava', moving: true, speedX: 3, minX: 20, maxX: 220 }, { x: 220, y: 870, w: 50, h: 10, type: 'ground' }, { x: 120, y: 740, w: 50, h: 10, type: 'ground', moving: true, speedX: 1.5, minX: 100, maxX: 300 }, { x: 50, y: 610, w: 50, h: 10, type: 'ground' }, { x: 150, y: 480, w: 50, h: 10, type: 'ground' }, { x: 260, y: 350, w: 50, h: 10, type: 'ground' }, { x: 100, y: 220, w: 50, h: 10, type: 'ground' }, { x: 120, y: 80, w: 120, h: 15, type: 'goal' }
            ]},
            { height: 2400, spawnX: 170, spawnY: 2350, items: [{x: 60, y: 2210}, {x: 270, y: 2210}, {x: 160, y: 1520}, {x: 110, y: 1380}, {x: 230, y: 1380}, {x: 70, y: 680}, {x: 170, y: 400}], objects: [
                { x: 140, y: 2380, w: 80, h: 20, type: 'ground' }, { x: 0, y: 2390, w: 360, h: 10, type: 'lava' }, { x: 50, y: 2250, w: 50, h: 10, type: 'ground' }, { x: 260, y: 2250, w: 50, h: 10, type: 'ground' }, { x: 150, y: 2120, w: 60, h: 10, type: 'ground' }, { x: 100, y: 1980, w: 50, h: 10, type: 'ground', moving: true, speedX: 2, minX: 50, maxX: 260 }, { x: 40, y: 1840, w: 50, h: 10, type: 'ground' }, { x: 270, y: 1700, w: 50, h: 10, type: 'ground' }, { x: 150, y: 1560, w: 60, h: 10, type: 'ground' }, { x: 50, y: 1450, w: 260, h: 10, type: 'lava', moving: true, speedX: 0, minX: 0, maxX: 0 }, { x: 100, y: 1420, w: 40, h: 10, type: 'ground' }, { x: 220, y: 1420, w: 40, h: 10, type: 'ground' }, { x: 160, y: 1280, w: 40, h: 10, type: 'ground' }, { x: 50, y: 1140, w: 40, h: 10, type: 'ground' }, { x: 270, y: 1000, w: 40, h: 10, type: 'ground' }, { x: 160, y: 860, w: 40, h: 10, type: 'ground', moving: true, speedX: -2.5, minX: 60, maxX: 260 }, { x: 60, y: 720, w: 40, h: 10, type: 'ground' }, { x: 260, y: 580, w: 40, h: 10, type: 'ground' }, { x: 160, y: 440, w: 40, h: 10, type: 'ground' }, { x: 80, y: 300, w: 40, h: 10, type: 'ground' }, { x: 240, y: 160, w: 40, h: 10, type: 'ground' }, { x: 120, y: 60, w: 120, h: 15, type: 'goal' }
            ]}
        ];

        function hideAllScreens() {
            startScreen.style.display = 'none';
            levelSelectScreen.style.display = 'none';
            pauseScreen.style.display = 'none';
            endScreen.style.display = 'none';
            uiDiv.style.display = 'none';
            controlsDiv.style.display = 'none';
        }

        function showLevelSelect() {
            hideAllScreens();
            levelSelectScreen.style.display = 'flex';
            const container = document.getElementById('lvlBtnContainer');
            container.innerHTML = ''; 

            for(let i = 0; i < levelsData.length; i++) {
                const btn = document.createElement('div');
                let isNewlyUnlocked = (i === newlyUnlockedLevel);
                let isUnlocked = (i < highestUnlocked && !isNewlyUnlocked);
                
                btn.className = 'lvl-btn ' + (isUnlocked ? 'unlocked' : 'locked');
                btn.id = 'lvlBtn-' + i;
                
                let icon = isUnlocked ? '🔓' : '🔒';
                let txt = isUnlocked ? 'อนุญาต' : 'ล็อก';
                
                if(isNewlyUnlocked) {
                    icon = '🔒'; txt = 'ล็อก';
                }

                btn.innerHTML = `<span>ด่าน_0${i+1}</span><span class="status-txt">${txt} ${icon}</span>`;
                
                if (isUnlocked || isNewlyUnlocked) {
                    btn.onclick = () => { if(btn.classList.contains('unlocked')) startStage(i); };
                }
                container.appendChild(btn);
            }

            if (newlyUnlockedLevel !== -1) {
                setTimeout(() => {
                    playSound('padlock');
                    const targetBtn = document.getElementById('lvlBtn-' + newlyUnlockedLevel);
                    targetBtn.className = 'lvl-btn unlocked unlock-anim';
                    targetBtn.querySelector('.status-txt').innerText = 'อนุญาต 🔓';
                    targetBtn.onclick = () => { startStage(newlyUnlockedLevel); };
                    newlyUnlockedLevel = -1; 
                }, 800); 
            }
            
            gameState = 'LEVEL_SELECT';
        }

        document.getElementById('btnStart').addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            showLevelSelect();
        });

        document.getElementById('btnPause').addEventListener('click', () => {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                pauseScreen.style.display = 'flex';
                controlsDiv.style.display = 'none';
            }
        });

        document.getElementById('btnResume').addEventListener('click', () => {
            gameState = 'PLAYING';
            lastTime = Date.now(); 
            pauseScreen.style.display = 'none';
            controlsDiv.style.display = 'flex';
        });

        document.getElementById('btnQuitMenu').addEventListener('click', () => {
            showLevelSelect();
        });

        document.getElementById('btnRestart').addEventListener('click', () => {
            highestUnlocked = 1;
            totalElapsedTime = 0;
            showLevelSelect();
        });

        function startStage(index) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            currentLevel = index;
            let data = levelsData[currentLevel];
            
            levelObjects = data.objects.map(obj => ({...obj}));
            levelItems = data.items.map(item => ({...item, collected: false}));
            
            player.x = data.spawnX; player.y = data.spawnY;
            player.dx = 0; player.dy = 0; player.currentPlatform = null;
            
            dataCollected = 0; terminalUnlocked = false;
            
            document.getElementById('levelText').innerText = `ด่าน: ${currentLevel + 1}/${levelsData.length}`;
            dataText.innerText = `ข้อมูล: 0/${levelItems.length}`;
            dataText.style.color = '#ccff00';
            
            if(currentLevel === 0) totalElapsedTime = 0; 
            
            hideAllScreens();
            uiDiv.style.display = 'flex';
            controlsDiv.style.display = 'flex';
            
            playSound('clear'); 
            gameState = 'PLAYING';
            lastTime = Date.now();
        }

        function rectIntersect(r1, r2) {
            return !(r2.x >= r1.x + r1.w || r2.x + r2.w <= r1.x || r2.y >= r1.y + r1.h || r2.y + r2.h <= r1.y);
        }

        function update() {
            if (gameState !== 'PLAYING') {
                if (keys.jump && (gameState === 'GAMEOVER' || gameState === 'STAGE_CLEAR')) {
                    if (gameState === 'GAMEOVER') startStage(currentLevel);
                    else if (gameState === 'STAGE_CLEAR') { showLevelSelect(); }
                    keys.jump = false;
                }
                return;
            }

            let now = Date.now();
            let dt = (now - lastTime) / 1000;
            totalElapsedTime += dt;
            lastTime = now;
            
            backgroundOffset = (backgroundOffset + 1) % 50;
            document.getElementById('timerText').innerText = `เวลา: ${totalElapsedTime.toFixed(2)}วิ`;
            
            let lvlData = levelsData[currentLevel];

            for (let rect of levelObjects) {
                if (rect.moving) {
                    rect.x += rect.speedX;
                    if (rect.x <= rect.minX || rect.x + rect.w >= rect.maxX) rect.speedX *= -1;
                }
            }

            if (keys.left) player.dx = -player.speed;
            else if (keys.right) player.dx = player.speed;
            else player.dx = 0;

            if (player.currentPlatform && player.currentPlatform.moving) player.dx += player.currentPlatform.speedX;

            if (keys.jump && player.grounded) {
                player.dy = player.jumpPower; player.grounded = false; player.currentPlatform = null; playSound('jump');
            }

            player.dy += player.gravity; player.x += player.dx; player.y += player.dy;

            if (player.x < 0) player.x = 0;
            if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;
            if (player.y > lvlData.height + 50) { playSound('death'); gameState = 'GAMEOVER'; }

            for (let item of levelItems) {
                if (!item.collected) {
                    if (rectIntersect(player, {x: item.x, y: item.y, w: 15, h: 15})) {
                        item.collected = true; dataCollected++; playSound('item');
                        dataText.innerText = `ข้อมูล: ${dataCollected}/${levelItems.length}`;
                        if (dataCollected === levelItems.length) {
                            terminalUnlocked = true; dataText.innerText = `ปลดล็อกเทอร์มินัลแล้ว!`;
                            dataText.style.color = '#00ffaa'; playSound('unlock');
                        }
                    }
                }
            }

            let wasGrounded = player.grounded;
            player.grounded = false; player.currentPlatform = null;

            for (let rect of levelObjects) {
                if (rectIntersect(player, rect)) {
                    if (rect.type === 'lava') {
                        playSound('death'); gameState = 'GAMEOVER';
                    } else if (rect.type === 'goal') {
                        if (terminalUnlocked) {
                            if (currentLevel < levelsData.length - 1) {
                                playSound('clear'); 
                                gameState = 'STAGE_CLEAR';
                                
                                if (highestUnlocked <= currentLevel + 1) {
                                    highestUnlocked = currentLevel + 2;
                                    newlyUnlockedLevel = currentLevel + 1;
                                }
                                
                                setTimeout(() => { if(gameState === 'STAGE_CLEAR') showLevelSelect(); }, 1500);

                            } else {
                                playSound('win');
                                let timePenalty = Math.floor(totalElapsedTime * 100);
                                let finalScore = Math.max(0, 40000 - timePenalty);
                                document.getElementById('finalTimeDisplay').innerText = `${totalElapsedTime.toFixed(2)}วิ`;
                                document.getElementById('finalScoreDisplay').innerText = finalScore.toLocaleString();
                                hideAllScreens(); endScreen.style.display = 'flex'; gameState = 'GAME_CLEAR';
                            }
                        } else {
                            if (player.dy > 0 && (player.y + player.h - player.dy) <= rect.y + 12) {
                                player.grounded = true; player.currentPlatform = rect; player.dy = 0; player.y = rect.y - player.h;
                            } else if (player.dy < 0 && (player.y - player.dy) >= rect.y + rect.h - 5) {
                                player.dy = 0; player.y = rect.y + rect.h;
                            }
                        }
                    } else if (rect.type === 'ground') {
                        if (player.dy > 0 && (player.y + player.h - player.dy) <= rect.y + 12) {
                            player.grounded = true; player.currentPlatform = rect; player.dy = 0; player.y = rect.y - player.h;
                            if (!wasGrounded) playSound('land'); 
                        } else if (player.dy < 0 && (player.y - player.dy) >= rect.y + rect.h - 5) {
                            player.dy = 0; player.y = rect.y + rect.h;
                        }
                    }
                }
            }

            let targetCameraY = player.y - canvas.height / 2;
            targetCameraY = Math.max(0, Math.min(targetCameraY, lvlData.height - canvas.height));
            cameraY += (targetCameraY - cameraY) * 0.1;
        }

        function draw() {
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (['MENU', 'LEVEL_SELECT', 'GAME_CLEAR'].includes(gameState)) return; 

            ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
            ctx.lineWidth = 1; ctx.beginPath();
            for (let i = 0; i <= canvas.width; i += 40) { ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); }
            for (let i = backgroundOffset; i <= canvas.height; i += 50) { ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); }
            ctx.stroke();

            ctx.save();
            ctx.translate(0, -cameraY);

            for (let rect of levelObjects) {
                if (rect.type === 'ground') {
                    let neonColor = rect.moving ? '#00ffaa' : '#00aaff';
                    ctx.fillStyle = `rgba(${rect.moving ? '0,255,170' : '0,170,255'}, 0.15)`; ctx.strokeStyle = neonColor;
                    ctx.lineWidth = 2; ctx.shadowBlur = 10; ctx.shadowColor = neonColor;
                    ctx.fillRect(rect.x, rect.y, rect.w, rect.h); ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
                } 
                else if (rect.type === 'lava') {
                    ctx.fillStyle = '#ff0055'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff0055';
                    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(rect.x, rect.y + rect.h/2 - 2, rect.w, 4); 
                } 
                else if (rect.type === 'goal') {
                    let termColor = terminalUnlocked ? '#00ffaa' : '#ff0055';
                    ctx.fillStyle = `rgba(${terminalUnlocked ? '0,255,170' : '255,0,85'}, 0.3)`; ctx.strokeStyle = termColor;
                    ctx.lineWidth = 2; ctx.shadowBlur = 20; ctx.shadowColor = termColor;
                    ctx.fillRect(rect.x, rect.y, rect.w, rect.h); ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
                    ctx.fillStyle = termColor; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';
                    ctx.fillText(terminalUnlocked ? 'ปลดล็อก' : 'ล็อก', rect.x + rect.w/2, rect.y + 12);
                }
                ctx.shadowBlur = 0;
            }

            for (let item of levelItems) {
                if (!item.collected) {
                    ctx.fillStyle = '#ccff00'; ctx.shadowBlur = 15; ctx.shadowColor = '#ccff00';
                    ctx.beginPath(); ctx.moveTo(item.x + 7.5, item.y); ctx.lineTo(item.x + 15, item.y + 7.5); ctx.lineTo(item.x + 7.5, item.y + 15); ctx.lineTo(item.x, item.y + 7.5); ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            ctx.fillStyle = player.color; ctx.shadowBlur = 20; ctx.shadowColor = player.color;
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(player.x + 5, player.y + 5, player.w - 10, player.h - 10);
            ctx.shadowBlur = 0;
            ctx.restore();

            ctx.textAlign = 'center';
            if (gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(10, 0, 5, 0.8)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff0055'; ctx.font = 'bold 36px Courier New, Tahoma'; ctx.fillText('ระบบล้มเหลว', canvas.width/2, 300);
                ctx.fillStyle = '#00ffff'; ctx.font = '16px Courier New, Tahoma'; ctx.fillText('> กดกระโดดเพื่อเริ่มใหม่', canvas.width/2, 340);
            } else if (gameState === 'STAGE_CLEAR') {
                ctx.fillStyle = 'rgba(0, 20, 20, 0.8)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ffaa'; ctx.font = 'bold 32px Courier New, Tahoma'; ctx.fillText('เจาะระบบสำเร็จ!', canvas.width/2, 300);
                ctx.fillStyle = '#00ffff'; ctx.font = '16px Courier New, Tahoma'; ctx.fillText('กำลังกลับสู่เมนู...', canvas.width/2, 340);
            }
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
